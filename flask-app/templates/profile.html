<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="../static/master.css">
   <title>Profile</title>
</head>

<body class="background">
   <h1 class="login-header">Profile Settings</h1>

   {% if message %}
   <div class="login-info"
      style="{% if error %}color: #ff6b6b;{% else %}color: #90ee90;{% endif %} margin-bottom: 20px; padding: 10px; border-radius: 10px;">
      {{ message }}
   </div>
   {% endif %}

   <div class="login-container" style="height: auto; width: 50%; margin-bottom: 20px;">
      <form method="POST" action="{{ url_for('change_username') }}"
         style="width: 100%; display: flex; flex-direction: column; align-items: center;">
         <h2 class="login-info">Change Username</h2>
         <table class="login-handler" style="height: auto;">
            <tr>
               <td class="login-info">New Username:</td>
               <td><input type="text" name="NewUsername" required></td>
            </tr>
         </table>
         <button type="submit" id="login-button" style="margin-top: 15px;">Change Username</button>
      </form>
   </div>

   <div class="login-container" style="height: auto; width: 50%; margin-bottom: 20px;">
      <form method="POST" action="{{ url_for('change_password') }}"
         style="width: 100%; display: flex; flex-direction: column; align-items: center;">
         <h2 class="login-info">Change Password</h2>
         <table class="login-handler" style="height: auto;">
            <tr>
               <td class="login-info">Current Password:</td>
               <td><input type="password" name="CurrentPassword" required></td>
            </tr>
            <tr>
               <td class="login-info">New Password:</td>
               <td><input type="password" name="NewPassowrd" required></td>
            </tr>
            <tr>
               <td class="login-info">Confirm Password:</td>
               <td><input type="password" name="ConfirmPassword" required></td>
            </tr>
         </table>
         <button type="submit" id="login-button" style="margin-top: 15px;">Change Password</button>
      </form>
   </div>

   <a class="vert-button" href="{{ url_for('logout') }}"
      style="width: 200px; height: 50px; margin: 20px auto;">Logout</a>
</body>

</html>
