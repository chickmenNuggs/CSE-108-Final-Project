<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <div id="app" data-username="{{ username }}"></div>
   <title>Document</title>
</head>

<body>
   <div class=background>
      <div class=lobby-menu>
         <div class="nav-bar">
            <a class="nav-button" href="{{url_for('home')}}"> Home</a>
            <a class="nav-button nav-active" id="info">Information</a>
            <a class="nav-button" id="create-lobby">Create a Lobby</a>
            <a class="nav-button" id="join-lobby">Join a Lobby</a>
         </div>
         <div class=info onclick="">
            <div class="bumblelings">
               <p>
                  You can create a lobby to join a friend or join a friend.
               </p>
               <p>
                  To do so, click "Create Lobby", then enter in your desired Lobby Name and Password.
               </p>
               <p>
                  To join a friend, click "Join a Lobby" and ask them for the Lobby Name and Password
               </p>
            </div>
         </div>
         <div class="create-lobby  hidden">
            <input name="LobbyName" id="LobbyName" placeholder="Lobby Name">
            <button id="CreateLobby">Create Lobby</button>
         </div>
         <div class="join-lobby hidden">
            <span>Lobby List</span>
            </span>
         </div>
      </div>
   </div>
   <!-- Don't remove the line below this is needed to get local username -->
   <script>
      window.localUserName = {{ localUserName | tojson }};
      window.SOCKET_EVENTS = {
         LOBBY_LIST: "{{ LOBBY_LIST }}",
         CREATE_LOBBY: "{{ CREATE_LOBBY }}",
         VIEW_LOBBIES: "{{ VIEW_LOBBIES }}",
         JOIN_LOBBY: "{{ JOIN_LOBBY }}",
         LOBBY_CREATED: "LobbyCreated"
      };
   </script>
   <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
   <script src="/static/Socket.js"></script> <!-- MUST come first -->
   <script src="../static/ClientLobby.js"></script>
   <script src="../static/Lobby.js"></script>
   <link rel="stylesheet" href="../static/master.css">
</body>

</html>
