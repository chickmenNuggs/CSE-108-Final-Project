<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src= "../static/master.js"></script>
    <link rel="stylesheet" href="../static/master.css">
    <title>Document</title>
</head>
<body>
    <div class = background>
        <div class = container>
            <div class = action-bar>
                <a class="action-buttons">File</a>
                <a class="action-buttons">Edit</a>
                <a class="action-buttons" href="{{url_for('home')}}">Home</a>

            </div>
            <div class = "wide-div">
                <div class = tool-bar>
                    <div class="color-selector">
                        
                    </div>
                    <div class = selected-color>
                        <label for ="selected-color"> Hex :</label>
                        <input id = "selected-color" type = "text" value = "#000000"> 
                    </div>
                    <div class = brush-settings>
                        <div class="brush-size">
                            <input type="range" value="10" id = brush-range oninput="syncBrushSize('brush-range', 'brush-num')">
                            <input type="number" id = brush-num min="1" max="100" step="1" value="10" oninput="syncBrushSize('brush-num', 'brush-range')">
                        </div>
                        <div class="brush-shape">
                            <div>
                                <button>
                                    Brush
                                </button>
                            </div>
                            <div>
                                <button>
                                    Circle
                                </button>
                                <input type="checkbox" id = "hollow-circle">
                            </div>
                            <div>
                                <button>
                                    Square
                                </button>
                                <input type="checkbox" id = "hollow-circle">
                            </div>
                            <div>
                                <button>
                                    Triangle
                                </button>
                                <input type="checkbox" id = "hollow-circle">
                            </div>
                        </div>
                    </div>
                </div>
                <div class = canvas-holder>
                    <div class = "create-new">
                        <table id = create-holder>
                            <tr>
                                <td>
                                    <label  class="create-input" for="width">Width : </label>
                                    <input  class="create-input" id="width" value="7015">
                                    <select class="create-input" name="width" id="w-measure" onclick="getprevUnit('w-measure')" onchange="unitConversion('w-measure')">
                                        <option value="px">px</option>
                                        <option value="cm">cm</option>
                                        <option value="in">in</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <label  class="create-input" for="height">height : </label>
                                    <input  class="create-input" id="height" value="4960">
                                    <select class="create-input" name="height" id="h-measure" onfocus="getprevUnit('h-measure')" onchange="unitConversion('h-measure')">
                                        <option value="px">px</option>
                                        <option value="cm">cm</option>
                                        <option value="in">in</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td>
                                     <button class="create-input" onclick="swapWidthHeight()"> Swap Width and Height</button>
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <button class="create-input" onclick="canvasInit()"> Create Canvas </button>
                                </td>
                            </tr>
                        </table>
                    </div>       
                    <canvas id="myCanvas" class = "hidden">
                        Your browser does not support the Canvas element :&#40
                    </canvas>
               </div>
               <div class = manipulator>
                    <div class = 'view-finder'>
                        <!-- Navigator -->
                    </div>
                    <div class = neo-roster>
                        <div class = header>
                            <div id = l>
                                Player Roster
                            </div>
                            <div id = r>
                                1/4
                            </div>
                        </div>
                        <div class = player-list>
                            <div id = host> You (Host)</div>
                        </div>
                    </div>
<!-- 
                    <table class = roster>
                        <tr id = header>
                            <th> Player Roster</th>
                            <th id = count> 1/4</th>
                        </tr>
                        <tr id = player-list>
                            <td colspan="2" id = host;>
                                You (host)
                            </td>
                        </tr>
                        <tr>
                            <td id = player>
                                text
                            </td>
                        </tr>
                        <tr>
                            <td>
                                text
                            </td>
                        </tr>
                        <tr>
                            <td>
                                text
                            </td>
                        </tr>
                    </table>
                     -->
                    <div class = 'layer'>

                    </div>
               </div>
            </div>
        </div>
        
    </div>
</body>
</html>
